name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# 같은 브랜치/PR에 새 커밋이 올라오면 이전 실행을 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 환율 API 키는 GitHub Secrets에서 받아 app/build.gradle.kts가 BuildConfig에 넣는다.
    # 시크릿이 없으면(등록 전·포크 PR) 빈 문자열이 되어 빌드는 그대로 통과한다
    env:
      EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gradle-daemon-jvm.properties의 toolchainVersion(25)과 맞춘다
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Gradle 캐시와 wrapper 검증을 처리한다
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint 검사
        run: ./gradlew ktlintCheck

      - name: Debug 빌드
        run: ./gradlew assembleDebug

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest