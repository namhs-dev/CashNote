<?xml version="1.0" encoding="UTF-8"?>
<!--
  포켓장부 앱 아이콘 원본. 메모장 + 원화 기호.
  좌표는 Android adaptive icon과 같은 108x108이다. 경로를 바꾸면
  app/src/main/res/drawable/ic_launcher_foreground.xml·ic_launcher_monochrome.xml도 같이 바꾼다.
  Play 스토어용 512 PNG는 이 파일을 512x512로 렌더한 것이다(모서리 둥글림은 Play가 적용).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- 배경: 브랜드 초록 -->
  <rect width="108" height="108" fill="#1B6B5A" />
  <!-- 메모장. 오른쪽 위 모서리가 접혀 있다 -->
  <path fill="#FFFFFF"
    d="M39,31 L63,31 L73,41 L73,73 A4,4 0 0 1 69,77 L39,77 A4,4 0 0 1 35,73 L35,35 A4,4 0 0 1 39,31 Z" />
  <!-- 접힌 모서리 -->
  <path fill="#A6F2DC" d="M63,31 L63,37 A4,4 0 0 0 67,41 L73,41 Z" />
  <!-- 원화 기호: W와 가로줄 두 개 -->
  <g fill="none" stroke="#1B6B5A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42,44 L46.5,58 L54,46 L61.5,58 L66,44" />
    <path d="M41,49.5 L67,49.5" />
    <path d="M41,53.5 L67,53.5" />
  </g>
  <!-- 장부 줄 -->
  <g fill="none" stroke="#A6F2DC" stroke-width="3" stroke-linecap="round">
    <path d="M42,65 L66,65" />
    <path d="M42,70 L58,70" />
  </g>
</svg>
